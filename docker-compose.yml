services:
  db:
    image: postgres:16-alpine
    container_name: logistic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-logistic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistic}
      POSTGRES_DB: ${DB_NAME:-logistic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logistic} -d ${DB_NAME:-logistic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: logistic-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
    container_name: logistic-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
